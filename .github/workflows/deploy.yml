# ──────────────────────────────────────────────────────────
# GEM Smart Contracts — CI Pipeline
# Trigger: push to main  ·  manual dispatch
# Flow:    test → SDK test → validate Docker deployer image
# Note:    GEM deploys on-chain via Ceiba RPC, not as a standalone service workload
# ──────────────────────────────────────────────────────────

name: GEM Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; cancel superseded runs
concurrency:
  group: deploy-gem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Build & test contracts ────────────────────────────
  test:
    name: 🧪 Contract Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract:
          - dalla_token
          - beli_nft
          - simple_dao
          - faucet
          - hello-belizechain
          - access_control
          - psp37_multi_token
          - dex/factory
          - dex/pair
          - dex/router
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.contract }}/target
          key: ${{ runner.os }}-${{ matrix.contract }}-test-${{ hashFiles(format('{0}/Cargo.lock', matrix.contract)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.contract }}-test-

      - name: Run tests
        run: |
          cd ${{ matrix.contract }}
          cargo test

  # ── 2. SDK tests ─────────────────────────────────────────
  sdk-test:
    name: 🧪 SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── 3. Validate Docker deployer image ────────────────────
  docker-build:
    name: 🐳 Build Deployer Image
    needs: [test, sdk-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build deployer image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gem-deployer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
