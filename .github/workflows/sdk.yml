name: SDK CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'sdk/**'
      # Without this line a PR that edits THIS workflow cannot validate itself. The push
      # trigger above already covers sdk.yml, but pull_request did not, so a change here
      # only ran after merge - which defeats the point of the PR check. Confirmed live on
      # dependabot#8 (setup-node 4 -> 7): it touched only this file, so the PR ran GEM
      # Contracts CI and nothing else, leaving every setup-node bump in here untested.
      - '.github/workflows/sdk.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

  test:
    name: Test SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Generate coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v4
        with:
          files: ./sdk/coverage/lcov.info
          flags: sdk
          name: gem-sdk
          fail_ci_if_error: false

  build:
    name: Build SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check package size
        run: |
          SIZE=$(npm pack --dry-run 2>&1 | grep "package size" | awk '{print $3}' || echo "unknown")
          echo "📦 Package size: $SIZE"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build
          path: sdk/dist
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration Tests (SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: |
          echo "ℹ️ Integration tests require BelizeChain node"
          echo "TODO: Start BelizeChain devnet"
          echo "TODO: Deploy contracts via SDK"
          echo "TODO: Test SDK against live contracts"
          npm run test:integration || echo "Integration tests not yet implemented"

  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./sdk
    needs: [lint, test, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Dry run publish
        run: npm publish --dry-run

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    defaults:
      run:
        working-directory: ./sdk
    needs: [lint, test, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: sdk/package.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
