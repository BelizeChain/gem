# Dependabot configuration for Gem.
#
# Why this file exists: security *alerts* are generated by GitHub automatically and
# never needed this file. What was missing was the scheduled version-update PRs.
#
# The github-actions entry specifically fixes a measured problem. Across the
# BelizeChain repos, action refs drifted apart because only some repos had this
# entry: the repos that had it sit at current versions (checkout v7, cache v6,
# upload-artifact v7, codecov v7), while the repos without it were left behind at
# v4/v5. This repo was one of the five without it, which is why its actions were
# stale. This file makes the repo self-healing.
#
# Deliberately NOT configured yet: the cargo and npm ecosystems. The contracts are
# pinned via Cargo.lock, and sdk/ is a published package whose dependency bumps
# should be deliberate releases. Both are maintainer volume decisions rather than
# bug fixes.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # This action's ref IS the Rust toolchain version, not an action version. Dependabot
    # reads `@1.90.0` as a semver and proposes e.g. `1.120.0`, which would silently swap
    # the compiler for every build. Confirmed live in gem#6: all 10 contract tests failed
    # in 4-7s. Bumping Rust is a deliberate change with its own CI run, not an automated one.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    labels:
      - "dependencies"
      - "github-actions"
