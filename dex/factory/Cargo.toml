[package]
name = "belizex_factory"
version = "1.0.0"
authors = ["BelizeChain Team <dev@belizechain.io>"]
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
ink = { version = "=5.1.1", default-features = false }
scale = { package = "parity-scale-codec", version = "=3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "=2.11.6", default-features = false, features = ["derive"], optional = true }
belizex_pair = { path = "../pair", default-features = false, features = ["ink-as-dependency"] }

[dev-dependencies]
ink_e2e = "=5.1.1"

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "belizex_pair/std",
]
ink-as-dependency = []
e2e-tests = []
